<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lục Trà Thăng Hoa Bến Cát</title>
  <!-- Tên + biểu tượng khi ghim ra màn hình chính -->
  <meta name="apple-mobile-web-app-title" content="Lục Trà Thăng Hoa Bến Cát">
  <meta name="application-name" content="Lục Trà Thăng Hoa Bến Cát">
  <meta name="theme-color" content="#0551AE">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #fff; color: #0A2B5E; }
    main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 18px; box-sizing: border-box; }
    .wrap { width: 100%; max-width: 420px; }
    .logo { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 6px 24px rgba(5, 81, 174, .18); }
    h1 { font-size: 21px; margin: 16px 0 4px; }
    .sub { margin: 0 0 16px; color: #4a5b74; font-size: 14.5px; }
    .card { background: #EEF4FC; border-radius: 14px; padding: 14px 16px; text-align: left; }
    .card h2 { font-size: 16px; margin: 0 0 8px; }
    ol { margin: 0; padding-left: 20px; }
    li { margin: 6px 0; font-size: 15px; line-height: 1.45; color: #23344d; }
    .note { margin: 10px 0 0; font-size: 13px; color: #4a5b74; line-height: 1.45; }
    a.btn { display: block; margin-top: 16px; padding: 14px 22px; border-radius: 12px; background: #0551AE; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
    .warn { background: #FFF4E5; color: #7A4A00; border-radius: 12px; padding: 12px 14px; text-align: left; }
    .muted { margin-top: 10px; font-size: 13px; color: #6b7a90; }
    code { background: #f1f4f8; padding: 1px 6px; border-radius: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <div class="wrap">
    <img class="logo" src="icons/icon-180.png" alt="Logo Lục Trà Thăng Hoa">
    <h1>Lục Trà Thăng Hoa Bến Cát</h1>
    <p class="sub" id="sub">Đang mở ứng dụng…</p>
    <div id="pin" class="hidden">
      <div class="card">
        <h2>Ghim ra màn hình chính</h2>
        <ol id="steps"></ol>
        <p class="note">Ô tên có thể sửa trước khi bấm <strong>Thêm</strong>. Biểu tượng là <strong>logo quán</strong>; bấm vào là mở thẳng ứng dụng.</p>
      </div>
      <a class="btn" id="go" href="#">Mở ứng dụng ngay</a>
      <p class="muted">Đã ghim rồi? Dùng biểu tượng logo ngoài màn hình chính để mở.</p>
    </div>
  </div>
</main>
<script>
  /* ====== Link /exec của Web App (Triển khai → Quản lý bản triển khai → URL ứng dụng web) ====== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzdSZd0E-_YxLFytRxlm0aHcP99yuznn0ty9d8zCvVXihLuCqEm8ODPwF0_mSCiJObvlw/exec';
  /* ============================================================================================ */

  (function () {
    var params = new URLSearchParams(location.search);
    var app = params.get('app') || '';                 // ?app=ketca | ship | nhansu → mở thẳng hệ thống đó
    var target = APP_URL + (app ? '?app=' + encodeURIComponent(app) : '');
    var sub = document.getElementById('sub');
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
      sub.outerHTML = '<p class="warn">Trang ghim chưa được cài link ứng dụng. Mở <code>index.html</code>, ' +
        'thay <code>DAN_LINK_EXEC_VAO_DAY</code> bằng link <code>…/exec</code> của Web App.</p>';
      return;
    }

    // Đang ghim trong tab này? (mở ?ghim=1 / #ghim, hoặc đã hiện trang ghim trước đó trong CÙNG tab → tải lại vẫn đứng yên)
    var pinning = params.get('ghim') === '1' || location.hash === '#ghim';
    try {
      if (pinning) sessionStorage.setItem('ltg_pin', '1');
      else if (sessionStorage.getItem('ltg_pin') === '1') pinning = true;
    } catch (e) {}

    // Mở từ BIỂU TƯỢNG đã ghim (?go=1, tab mới) → vào thẳng ứng dụng, cùng tab (dùng chung đăng nhập Google)
    if (params.get('go') === '1' && !pinning) {
      location.replace(target);
      // Quay lại (nút Back) về trang này → hiện trang ghim thay vì màn hình "Đang mở…"
      window.addEventListener('pageshow', function (ev) { if (ev.persisted) location.reload(); });
      return;
    }
    try { sessionStorage.setItem('ltg_pin', '1'); } catch (e) {}

    // Mở link trang ghim bình thường → ĐỨNG YÊN, hiện hướng dẫn ghim.
    // Đổi địa chỉ thành ?go=1 để biểu tượng ghim ra màn hình chính mở lên là vào thẳng ứng dụng.
    try {
      history.replaceState(null, '', location.pathname + '?go=1' + (app ? '&app=' + encodeURIComponent(app) : ''));
    } catch (e) {}
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    var inApp = /Zalo|FBAN|FBAV|Instagram|Line\//i.test(ua);
    var steps = inApp
      ? ['Trình duyệt trong Zalo/Facebook <strong>không ghim được</strong>. Bấm <strong>⋯</strong> (góc trên) → <strong>Mở bằng trình duyệt</strong> (Safari / Chrome), rồi làm lại.']
      : ios
        ? ['Bấm nút <strong>Chia sẻ</strong> (ô vuông có mũi tên lên, ở thanh dưới hoặc trên của Safari).',
           'Kéo xuống, chọn <strong>Thêm vào MH chính</strong>.',
           'Bấm <strong>Thêm</strong> (góc trên bên phải).']
        : ['Bấm nút <strong>⋮</strong> (góc trên bên phải của Chrome).',
           'Chọn <strong>Thêm vào màn hình chính</strong> (hoặc <strong>Cài đặt ứng dụng</strong>).',
           'Bấm <strong>Thêm</strong>.'];
    document.getElementById('steps').innerHTML = steps.map(function (s) { return '<li>' + s + '</li>'; }).join('');
    document.getElementById('go').href = target;
    sub.textContent = app === 'ketca' ? 'Kết ca' : app === 'ship' ? 'Tính ship' : app === 'nhansu' ? 'Nhân sự' : 'Tính ship · Kết ca · Nhân sự';
    document.getElementById('pin').classList.remove('hidden');
  })();
</script>
</body>
</html>
